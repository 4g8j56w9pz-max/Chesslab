<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FNAF ChessLab</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="app">

    <section class="game-area">
      <h1>FNAF ChessLab</h1>

      <div class="player-bar">
        <div class="player-card">
          <label for="whiteName">White Player</label>
          <input id="whiteName" type="text" value="Player 1" />
        </div>

        <div class="player-card">
          <label for="blackName">Black Player</label>
          <input id="blackName" type="text" value="Player 2" />
        </div>
      </div>

      <p id="status">White Player to move</p>

      <div id="board"></div>

      <div class="captured-area">
        <div class="captured-box">
          <h3>White Captured</h3>
          <div id="whiteCaptured" class="captured-pieces"></div>
        </div>

        <div class="captured-box">
          <h3>Black Captured</h3>
          <div id="blackCaptured" class="captured-pieces"></div>
        </div>
      </div>
    </section>

    <aside class="panel">
      <button id="resetBtn">Reset Game</button>
      <button id="flipBtn">Flip Board</button>

      <h2>Game Mode</h2>

      <label>
        Mode
        <select id="gameMode">
          <option value="local">Local Two Player</option>
          <option value="bot">Play vs Bot</option>
        </select>
      </label>

      <label id="botDifficultyRow">
        Bot Difficulty
        <select id="botDifficulty">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
      </label>

      <h2>Leaderboard</h2>

      <div class="score-row">
        <span id="whiteScoreName">Player 1</span>
        <strong id="whiteScore">0</strong>
      </div>

      <div class="score-row">
        <span id="blackScoreName">Player 2</span>
        <strong id="blackScore">0</strong>
      </div>

      <h2>Theme Sliders</h2>

      <label>
        Board Size
        <input id="boardSize" type="range" min="420" max="760" value="640" />
      </label>

      <label>
        Glow
        <input id="glow" type="range" min="0" max="40" value="18" />
      </label>

      <label>
        Piece Size
        <input id="pieceSize" type="range" min="28" max="76" value="42" />
      </label>
    </aside>

  </main>

  <script src="app.js"></script>
</body>
</html>
