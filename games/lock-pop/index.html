<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111113" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lock Pop" />
  <title>Lock Pop Arcade | Midnight Games</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/favicon.svg" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="lock-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-badge" aria-hidden="true">
          <svg viewBox="0 0 64 64" role="img">
            <circle cx="32" cy="32" r="23" />
            <path d="M32 12v9M32 43v9M12 32h9M43 32h9" />
            <path d="M44 20 32 32l-8 13" />
            <circle cx="32" cy="32" r="5" />
          </svg>
        </span>
        <div>
          <p class="eyebrow">Midnight Games</p>
          <h1>Lock Pop Arcade</h1>
        </div>
      </div>
    </header>

    <nav class="game-switcher" aria-label="Game selection">
      <a class="game-card" href="../../index.html">Merge</a>
      <a class="game-card" href="../../chesslab.html">Chess</a>
      <a class="game-card" href="../water-sort/">Water Sort</a>
      <a class="game-card is-active" href="./index.html" aria-current="page">Lock Pop</a>
      <a class="game-card" href="../soundboard/">FX Board</a>
      <a class="game-card nightfall-card" href="../nightfall/">
        <span>NIGHTFALL</span>
        <small>OPEN-SOURCE CLASSIC FPS</small>
      </a>
    </nav>

    <main class="arcade-layout">
      <section class="score-panel" aria-label="Lock Pop status">
        <div class="score-card">
          <span>Score</span>
          <strong id="score-value">0</strong>
        </div>
        <div class="score-card">
          <span>Best</span>
          <strong id="best-value">0</strong>
        </div>
        <div class="score-card">
          <span>Speed</span>
          <strong id="speed-value">1.7x</strong>
        </div>
        <div class="score-card status-card">
          <span>Status</span>
          <strong id="status-value">Ready</strong>
        </div>
      </section>

      <section id="playfield" class="playfield" aria-label="Lock Pop arcade cabinet">
        <div class="canvas-frame">
          <canvas
            id="game-canvas"
            width="720"
            height="720"
            tabindex="0"
            role="img"
            aria-label="Circular timing game. Press Space, Enter, or tap to start, hit the target notch, or restart. Press P or Escape to pause and M to toggle sound."
          ></canvas>
          <div id="perfect-indicator" class="perfect-indicator" aria-hidden="true">PERFECT</div>
        </div>

        <div class="controls" aria-label="Game controls">
          <button id="primary-action" class="primary-button" type="button">Start</button>
          <button id="pause-action" class="ghost-button" type="button">Pause</button>
          <button id="mute-action" class="ghost-button" type="button" aria-pressed="false">Sound is on</button>
        </div>
      </section>
    </main>
  </div>

  <div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
